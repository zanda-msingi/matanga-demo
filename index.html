<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Your Binder - m1NT Demo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #122023;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  .header {
    padding: 12px 24px;
    border-bottom: 1px solid #1a2c30;
    flex-shrink: 0;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 800px;
    margin: 0 auto;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .header-left img { height: 30px; }
  .header-left-text { line-height: 1.2; }
  .header-left-name { font-size: 15px; font-weight: 700; color: #fff; }
  .header-left-sub { font-size: 10px; color: #888; }
  .header-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .header-right-text { line-height: 1.2; text-align: right; }
  .header-right-name { font-size: 13px; font-weight: 600; color: #fff; }
  .header-right-sub { font-size: 10px; color: #888; }
  .header-right img { height: 36px; }
  .header-left:hover .header-left-name,
  .header-right:hover .header-right-name { color: #dffba8; }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  /* Welcome state */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: #555;
  }
  .welcome h2 { color: #888; font-size: 18px; margin-bottom: 16px; font-weight: 500; }
  .sample-queries {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .sample-queries button {
    padding: 6px 14px;
    font-size: 12px;
    font-family: inherit;
    background: transparent;
    border: 1px solid #333;
    border-radius: 16px;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sample-queries button:hover { border-color: #dffba8; color: #dffba8; }

  /* Messages */
  .msg { max-width: 100%; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg-user {
    align-self: flex-end;
    background: #1a3a40;
    border: 1px solid #2a4a50;
    border-radius: 12px 12px 4px 12px;
    padding: 10px 16px;
    font-size: 14px;
    color: #dffba8;
    max-width: 80%;
  }

  .msg-assistant {
    background: #141414;
    border: 1px solid #222;
    border-radius: 4px 12px 12px 12px;
    padding: 20px 24px;
    line-height: 1.7;
    font-size: 14px;
  }
  .msg-assistant h2, .msg-assistant h3 { color: #fff; margin-top: 14px; margin-bottom: 6px; }
  .msg-assistant h2 { font-size: 15px; }
  .msg-assistant h3 { font-size: 14px; }
  .msg-assistant p { margin-bottom: 8px; }
  .msg-assistant strong { color: #c4b5fd; }
  .msg-assistant a { color: #c4b5fd; text-decoration: underline; text-underline-offset: 3px; }
  .msg-assistant a:hover { color: #ddd0fe; }
  .msg-assistant ul, .msg-assistant ol { margin-left: 20px; margin-bottom: 8px; }
  .msg-assistant li { margin-bottom: 3px; }
  .msg-assistant table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .msg-assistant th, .msg-assistant td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #222; }
  .msg-assistant th { color: #a5a5a5; font-weight: 500; }
  .msg-assistant hr { border: none; border-top: 1px solid #222; margin: 12px 0; }
  .msg-meta { margin-top: 12px; padding-top: 10px; border-top: 1px solid #222; font-size: 11px; color: #555; display: flex; justify-content: space-between; }

  .msg-error { background: #1a0a0a; border-color: #3a1515; }
  .msg-error p { color: #f87171; }

  /* Thinking indicator */
  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    color: #888;
    font-size: 13px;
  }
  .thinking-dots span {
    display: inline-block;
    width: 6px; height: 6px;
    background: #dffba8;
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

  /* Input bar - fixed at bottom */
  .input-bar {
    flex-shrink: 0;
    border-top: 1px solid #1a2c30;
    padding: 12px 20px;
    background: #0e1a1c;
  }
  .input-bar-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  .input-bar input {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-bar input:focus { border-color: #dffba8; }
  .input-bar input::placeholder { color: #555; }
  .input-bar button {
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    background: #dffba8;
    color: #122023;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .input-bar button:hover { background: #c8f078; }
  .input-bar button:disabled { background: #333; cursor: not-allowed; }
  .disclaimer {
    font-size: 10px;
    color: #555;
    text-align: center;
    margin-top: 6px;
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-row" style="position: relative;">
    <a href="https://matangaresearch.com" target="_blank" class="header-left" title="Powered by MATANGA">
      <img src="assets/m1nt-logo.png" alt="m1NT">
      <div class="header-left-text">
        <div class="header-left-name">m1NT</div>
        <div class="header-left-sub">AI compliance agent</div>
      </div>
    </a>
    <div class="header-center">Ask Your Binder</div>
    <a href="https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder" target="_blank" class="header-right" title="Open Heritage Valley Foods Smart Binder">
      <img src="assets/heritage-valley-logo.svg" alt="Heritage Valley Foods">
    </a>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <img src="assets/m1nt-logo.png" alt="m1NT" style="height: 48px; opacity: 0.5; margin-bottom: 12px;">
    <h2>What would you like to know about your binder?</h2>
    <div class="sample-queries">
      <button onclick="tryQuery(this)">Trace lot 2831 from production to shipping</button>
      <button onclick="tryQuery(this)">Show me open CAPAs</button>
      <button onclick="tryQuery(this)">Is our allergen program up to date?</button>
      <button onclick="tryQuery(this)">What happened with the Coastal mold complaint?</button>
      <button onclick="tryQuery(this)">What docs do I need for a BRCGS audit?</button>
    </div>
  </div>
</div>

<div class="input-bar">
  <div class="input-bar-inner">
    <input type="text" id="query" placeholder="Ask about quality records, compliance, audit readiness..." autofocus>
    <button id="submit" onclick="askBinder()">Ask</button>
  </div>
  <p class="disclaimer">Demo environment with sample data. AI-generated responses may contain errors. Always verify against source documents.</p>
</div>

<script>
const WEBHOOK_URL = 'https://zandap.app.n8n.cloud/webhook/ask-your-binder-demo';
const chatArea = document.getElementById('chatArea');
const queryInput = document.getElementById('query');
const welcome = document.getElementById('welcome');

queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') askBinder();
});

function tryQuery(btn) {
  queryInput.value = btn.textContent;
  askBinder();
}

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addUserMessage(text) {
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.textContent = text;
  chatArea.appendChild(div);
  scrollToBottom();
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking';
  div.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div> Searching your binder...';
  chatArea.appendChild(div);
  scrollToBottom();
  return div;
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

function addAssistantMessage(html, model, elapsed, isError) {
  const div = document.createElement('div');
  div.className = 'msg msg-assistant' + (isError ? ' msg-error' : '');
  div.innerHTML = html + '<div class="msg-meta"><span>' + (model || '') + '</span><span>' + (elapsed || '') + '</span></div>';
  chatArea.appendChild(div);
  scrollToBottom();
}

async function askBinder() {
  const query = queryInput.value.trim();
  if (!query) return;

  const btn = document.getElementById('submit');
  addUserMessage(query);
  queryInput.value = '';
  btn.disabled = true;

  const thinkingEl = addThinking();
  const start = Date.now();

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    const data = await res.json();
    const elapsed = ((Date.now() - start) / 1000).toFixed(1) + 's';
    const item = Array.isArray(data) ? data[0] : data;

    removeThinking();
    addAssistantMessage(
      markdownToHtml(item.response || 'No response received.'),
      item.model || '',
      elapsed,
      item.error
    );
  } catch (err) {
    removeThinking();
    addAssistantMessage('<p>Connection error: ' + err.message + '</p>', '', '', true);
  } finally {
    btn.disabled = false;
    queryInput.focus();
  }
}

function markdownToHtml(md) {
  const linkMap = {};
  let linkIdx = 0;
  let processed = md.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (match, text, url) => {
    const key = `__LINK${linkIdx++}__`;
    linkMap[key] = '<a href="' + url + '" target="_blank">' + text + '</a>';
    return key;
  });

  processed = processed.replace(/(https?:\/\/[^\s<>)\]]+)/g, (match) => {
    if (match.startsWith('__LINK')) return match;
    const key = `__LINK${linkIdx++}__`;
    const display = match.length > 60 ? match.substring(0, 57) + '...' : match;
    linkMap[key] = '<a href="' + match + '" target="_blank">' + display + '</a>';
    return key;
  });

  // Also auto-link doc filenames to their SharePoint URLs
  const docLinks = {
    'PLN-HACCP-Master-Plan-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B2052BD99-2321-4694-872B-CCF63DD91706%7D',
    'DOC-HACCP-Team-List-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7BE0352F45-400F-4724-8EAD-D85424E5EC1C%7D',
    'DOC-Product-Description-HVF-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7BEEB7C34F-F124-4198-BF12-D5B05E50D37E%7D',
    'DGM-Process-Flow-Bakery-v2.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B0C9307E8-4695-4A49-A4CC-A5DC2D41470B%7D',
    'DGM-Process-Flow-Bakery-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B0A972A34-6D29-4209-99F0-FAC24DC8079E%7D',
    'CHT-CCP-001-Metal-Detection-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B1CFC0F1A-9567-4C3B-9C80-6E766BF01584%7D',
    'CHT-CCP-002-Baking-Temp-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B0B360F83-A77F-4A55-B75E-0B0614546A38%7D',
    'FRM-CCP-Corrective-Action-Log-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B8BFB824F-65BF-4A82-BB5E-0BA717D01725%7D',
    'FRM-Mock-Recall-Exercise-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B72E00CD4-E952-48F8-8144-DE9E559108D0%7D',
    'RPT-CAPA-2026-042-Investigation-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B713456DF-3DC4-4ECB-84D5-A985269E7F66%7D',
    'DOC-Document-Naming-Conventions-v1.0': 'https://matangaresearchllc.sharepoint.com/sites/heritage-valley-smart-binder/_layouts/15/Doc.aspx?sourcedoc=%7B932F9714-E103-4936-9CF9-201DEC679600%7D',
  };
  for (const [docName, url] of Object.entries(docLinks)) {
    // Match both .docx and plain references
    const patterns = [docName + '.docx', docName + '.xlsx', docName];
    for (const pat of patterns) {
      if (processed.includes(pat) && !processed.includes('__LINK' + pat)) {
        const key = `__LINK${linkIdx++}__`;
        linkMap[key] = '<a href="' + url + '" target="_blank">' + pat + '</a>';
        processed = processed.split(pat).join(key);
      }
    }
  }

  let html = processed
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, (match, header, body) => {
      const ths = header.split('|').map(h => h.trim()).filter(Boolean).map(h => '<th>' + h + '</th>').join('');
      const rows = body.trim().split('\n').map(row => {
        const tds = row.split('|').map(c => c.trim()).filter(Boolean).map(c => '<td>' + c + '</td>').join('');
        return '<tr>' + tds + '</tr>';
      }).join('');
      return '<table><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table>';
    })
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>');

  html = html.replace(/((?:<li>.*?<\/li>\s*(?:<br>)?)+)/g, '<ul>$1</ul>');
  html = html.replace(/<br><\/ul>/g, '</ul>');
  html = html.replace(/<ul><br>/g, '<ul>');

  for (const [key, link] of Object.entries(linkMap)) {
    html = html.split(key).join(link);
  }

  return '<p>' + html + '</p>';
}
</script>

</body>
</html>
